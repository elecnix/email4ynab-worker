name: CI

on:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build, lint, test
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci

      - name: Generate Types
        run: npm run generate-types

      - name: Run tests
        run: npm test
